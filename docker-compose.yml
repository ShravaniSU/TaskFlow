services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - taskflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE}
    build:
      context: ./backend
      args:
        - DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${BACKEND_PORT}
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    expose:
      - "${BACKEND_PORT}"
    networks:
      - taskflow_network
      
  frontend:
    image: ${FRONTEND_IMAGE}
    build: ./frontend
    restart: unless-stopped
    expose:
      - "${FRONTEND_PORT}"
    networks:
      - taskflow_network

  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT}:${NGINX_PORT}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - taskflow_network

volumes:
  pgdata:

networks:
  taskflow_network:
    driver: bridge
