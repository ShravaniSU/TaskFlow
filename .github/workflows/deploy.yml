name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - run: npm run build
        working-directory: ${{ matrix.app }}
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

  deploy:
    needs: validate  # 🚀 Runs immediately after the validation job passes
    runs-on: ubuntu-latest
    if: ${{ secrets.EC2_HOST != '' && secrets.EC2_SSH_KEY != '' && secrets.EC2_USERNAME != '' }}
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to your project directory
            cd ~/TaskFlow
            
            # Fetch the fresh code changes from GitHub
            git pull origin main
            
            # Build the containers locally from source and launch them
            sudo docker compose up --build -d