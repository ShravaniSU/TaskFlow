---
- name: Deploy TaskFlow to AWS
  hosts: taskflow
  become: true
  vars:
    app_dir: /opt/taskflow
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - docker.io
          - docker-compose
        state: present

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy compose and environment files
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      loop:
        - docker-compose.yml
        - .env

    - name: Copy nginx config directory
      ansible.builtin.copy:
        src: ../nginx
        dest: "{{ app_dir }}"
        owner: ubuntu
        group: ubuntu
        directory_mode: "0755"

    - name: Copy backend source directory
      ansible.builtin.copy:
        src: ../backend
        dest: "{{ app_dir }}/"
        owner: ubuntu
        group: ubuntu
        directory_mode: "0755"

    - name: Copy frontend source directory
      ansible.builtin.copy:
        src: ../frontend
        dest: "{{ app_dir }}/"
        owner: ubuntu
        group: ubuntu
        directory_mode: "0755"

    - name: Start TaskFlow
      ansible.builtin.command:
        cmd: docker-compose up -d --build
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Verify health endpoint
      ansible.builtin.uri:
        url: "http://localhost"
        status_code: [200, 404]